name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  api:
    name: API (lint, test, build)
    runs-on: ubuntu-latest
    env:
      NODE_ENV: test
    services:
      # Configured to match services/flashcards-api's own dev-default connection
      # settings (see src/database/data-source.ts / src/redis/redis.module.ts)
      # so this job needs zero extra env vars — the same fallbacks that make
      # local setup work with no .env file make CI work with no secrets.
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: flashcards
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: services/flashcards-api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: services/flashcards-api/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run migration:run
      - run: npm run test
      - run: npm run test:e2e
      - run: npm run build

  web:
    name: Web (lint, typecheck, build)
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_API_URL: http://localhost:3001/api/v1
    defaults:
      run:
        working-directory: apps/flashcards-web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/flashcards-web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npx next typegen
      - run: npx tsc --noEmit
      - run: npm run build
