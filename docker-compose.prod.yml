# Full self-hosted stack (Postgres + Redis + API + Web). For local
# development, use services/flashcards-api/docker-compose.yml instead — that one only
# runs Postgres/Redis and expects you to run `npm run start:dev` /
# `npm run dev` directly, which is faster to iterate on than rebuilding a
# Docker image on every change.
#
# Usage:
#   cp services/flashcards-api/.env.example services/flashcards-api/.env.prod   # then fill in real secrets
#   docker compose -f docker-compose.prod.yml --env-file services/flashcards-api/.env.prod up -d --build
#   docker compose -f docker-compose.prod.yml exec api npm run migration:run

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DATABASE_USERNAME:-postgres}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:?DATABASE_PASSWORD must be set}
      POSTGRES_DB: ${DATABASE_NAME:-flashcards}
    volumes:
      - flashcards_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DATABASE_USERNAME:-postgres}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ./services/flashcards-api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 3001
      WEB_URL: ${WEB_URL:?WEB_URL must be set to the deployed web app's real origin}
      DATABASE_HOST: postgres
      DATABASE_PORT: 5432
      DATABASE_USERNAME: ${DATABASE_USERNAME:-postgres}
      DATABASE_PASSWORD: ${DATABASE_PASSWORD:?DATABASE_PASSWORD must be set}
      DATABASE_NAME: ${DATABASE_NAME:-flashcards}
      REDIS_URL: redis://redis:6379
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:?JWT_ACCESS_SECRET must be set}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:?JWT_REFRESH_SECRET must be set}
      JWT_ACCESS_EXPIRES_IN: ${JWT_ACCESS_EXPIRES_IN:-15m}
      JWT_REFRESH_EXPIRES_IN: ${JWT_REFRESH_EXPIRES_IN:-30d}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      GOOGLE_CALLBACK_URL: ${GOOGLE_CALLBACK_URL:-}
    ports:
      - "3001:3001"

  web:
    build:
      context: ./apps/flashcards-web
      args:
        # Baked into the client bundle at build time (see apps/flashcards-web/Dockerfile)
        # — must be the API's real public URL, not the in-network "api"
        # hostname, since the browser (not just the server) calls it too.
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:?NEXT_PUBLIC_API_URL must be set to the API's public URL}
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "3000:3000"

volumes:
  flashcards_postgres_data:
